<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Digest — Subscribe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

       .card {
            background: linear-gradient(160deg, #e8f0fe 0%, #c5cae9 100%);
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #888888;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus {
            border-color: #1a73e8;
        }

        .categories-label {
            font-size: 13px;
            font-weight: 600;
            color: #444444;
            margin-bottom: 12px;
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 28px;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333333;
            cursor: pointer;
        }

        .category-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #1a73e8;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1558b0;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #e6f4ea;
            color: #2e7d32;
        }

        .message.error {
            background: #fce8e6;
            color: #c62828;
        }

        .unsubscribe-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888888;
        }

        .unsubscribe-link a {
            color: #1a73e8;
            text-decoration: none;
        }

        .unsubscribe-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📰 Morning Digest</h1>
        <p class="subtitle">Get a curated AI-powered news digest delivered to your inbox every morning at 8AM IST.</p>

        <div class="form-group">
            <label for="name">Your name</label>
            <input type="text" id="name" placeholder="Jethalal Gada" />
        </div>

        <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="jetheya@example.com" />
        </div>

        <p class="categories-label">Choose your categories</p>
        <div class="categories">
            <label class="category-item">
                <input type="checkbox" id="general" checked /> General
            </label>
            <label class="category-item">
                <input type="checkbox" id="business" checked /> Business
            </label>
            <label class="category-item">
                <input type="checkbox" id="science_tech" checked /> Science & Tech
            </label>
            <label class="category-item">
                <input type="checkbox" id="sports" checked /> Sports
            </label>
            <label class="category-item">
                <input type="checkbox" id="entertainment" /> Entertainment
            </label>
            <label class="category-item">
                <input type="checkbox" id="politics" /> Politics
            </label>
            <label class="category-item">
                <input type="checkbox" id="international_events" /> International
            </label>
        </div>

        <button onclick="subscribe()">Subscribe</button>
        <div class="message" id="message"></div>

        <div class="unsubscribe-link">
            Want to unsubscribe? <a href="/unsubscribe">Click here</a>
        </div>
    </div>

    <script>
        async function subscribe() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();

            if (!name || !email) {
                showMessage("Please enter your name and email.", "error");
                return;
            }

            const payload = {
                name,
                email,
                general: document.getElementById("general").checked,
                business: document.getElementById("business").checked,
                science_tech: document.getElementById("science_tech").checked,
                sports: document.getElementById("sports").checked,
                entertainment: document.getElementById("entertainment").checked,
                politics: document.getElementById("politics").checked,
                international_events: document.getElementById("international_events").checked
            };

            try {
                const response = await fetch("http://127.0.0.1:5000/subscribe", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message, "success");
                } else {
                    showMessage(data.error, "error");
                }
            } catch (error) {
                showMessage("Something went wrong. Please try again.", "error");
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById("message");
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = "block";
        }
    </script>
</body>
</html>
